<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proje | Said Uludağ</title>
  <meta name="description" content="Said Uludağ - Endüstriyel tasarım ve yazılım proje detayları.">
  <meta name="author" content="Said Uludağ">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=20.0">
</head>
<body>
  <div class="bg-grid"></div>

  <!-- Header / Navigation -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <span class="brand-name">SAİD ULUDAĞ</span>
    </a>
    <div class="nav-right">
      <nav class="nav-links">
        <a href="index.html#hub" class="nav-link" data-i18n="nav_explore">Keşfet</a>
        <a href="index.html#design" class="nav-link" data-i18n="nav_design">Design</a>
        <a href="index.html#code" class="nav-link" data-i18n="nav_code">Code</a>
        <a href="index.html#about" class="nav-link" data-i18n="nav_about">Hakkımda</a>
        <a href="index.html#contact" class="nav-link btn-contact" data-i18n="nav_contact">İletişim</a>
      </nav>
      <div class="lang-switch">
        <button id="lang-tr" class="lang-btn active" aria-label="Türkçe">TR</button>
        <span class="lang-divider">/</span>
        <button id="lang-en" class="lang-btn" aria-label="English">EN</button>
      </div>
    </div>
  </header>

  <!-- Project Detail -->
  <main id="project-page" class="section-container project-container">
    <a id="back-link" href="index.html#design" class="project-back">← Tüm Projeler</a>

    <div class="project-header">
      <span id="project-category" class="section-tag"></span>
      <h1 id="project-title" class="section-title"></h1>
      <p id="project-meta" class="project-meta"></p>
      <p id="project-desc" class="project-desc"></p>
      <div id="project-actions"></div>
    </div>

    <div id="project-gallery" class="project-gallery"></div>

    <div class="project-nav">
      <a id="prev-project" class="project-nav-link" href="#"></a>
      <a id="next-project" class="project-nav-link next" href="#"></a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Said Uludağ. Tüm hakları saklıdır. — <a href="https://saidow.com">saidow.com</a></p>
  </footer>

  <script src="i18n.js?v=2.0"></script>
  <script src="projects.js?v=1.0"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const p = PROJECTS[id];

      if (!p) {
        window.location.replace('index.html');
        return;
      }

      document.title = p.title + ' | Said Uludağ';
      document.getElementById('project-category').textContent = p.section + ' — ' + p.category;
      document.getElementById('project-title').textContent = p.title;
      document.getElementById('project-meta').textContent = p.meta;
      document.getElementById('project-desc').textContent = p.desc;

      const isDesign = p.section === 'Industrial Design';
      const backLink = document.getElementById('back-link');
      backLink.href = 'index.html#' + (isDesign ? 'design' : 'code');

      // Calculate Prev / Next IDs for navigation
      const idx = PROJECT_ORDER.indexOf(id);
      const prev = PROJECT_ORDER[(idx - 1 + PROJECT_ORDER.length) % PROJECT_ORDER.length];
      const next = PROJECT_ORDER[(idx + 1) % PROJECT_ORDER.length];

      window.updateProjectDetailI18n = function (lang) {
        const t = TRANSLATIONS[lang] || TRANSLATIONS.tr;
        backLink.textContent = t.project_back;

        // Content variables
        const title = (lang === 'en' && p.title_en) ? p.title_en : p.title;
        const section = (lang === 'en' && p.section_en) ? p.section_en : p.section;
        const category = (lang === 'en' && p.category_en) ? p.category_en : p.category;
        const meta = (lang === 'en' && p.meta_en) ? p.meta_en : p.meta;
        const desc = (lang === 'en' && p.desc_en) ? p.desc_en : p.desc;

        // Header metadata
        document.title = title + ' | Said Uludağ';
        document.getElementById('project-category').textContent = section + ' — ' + category;
        document.getElementById('project-title').textContent = title;
        document.getElementById('project-meta').textContent = meta;
        document.getElementById('project-desc').textContent = desc;

        const externalBtn = document.querySelector('.project-external');
        if (externalBtn) {
          externalBtn.textContent = t.project_external;
        }

        // Nav translations
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.dataset.i18n;
          if (t[key]) el.textContent = t[key];
        });

        // Prev/Next titles
        if (typeof prev !== 'undefined' && typeof next !== 'undefined') {
          const prevTitle = (lang === 'en' && PROJECTS[prev].title_en) ? PROJECTS[prev].title_en : PROJECTS[prev].title;
          const nextTitle = (lang === 'en' && PROJECTS[next].title_en) ? PROJECTS[next].title_en : PROJECTS[next].title;
          const prevEl = document.getElementById('prev-project');
          const nextEl = document.getElementById('next-project');
          if (prevEl) prevEl.textContent = '← ' + prevTitle;
          if (nextEl) nextEl.textContent = nextTitle + ' →';
        }
      };

      if (p.link) {
        const a = document.createElement('a');
        a.href = p.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'project-external';
        a.textContent = (typeof TRANSLATIONS !== 'undefined' && localStorage.getItem('saidow_lang') === 'en') ? TRANSLATIONS.en.project_external : 'Projeyi Ziyaret Et ↗';
        document.getElementById('project-actions').appendChild(a);
      }

      // Gallery: hero + detail images
      const gallery = document.getElementById('project-gallery');
      const files = ['hero'];
      for (let i = 1; i <= p.images; i++) files.push(String(i).padStart(2, '0'));
      files.forEach(function (f) {
        const img = document.createElement('img');
        img.src = 'assets/img/' + id + '/' + f + '.jpg';
        img.alt = p.title;
        img.loading = 'lazy';
        img.className = 'reveal';
        img.onerror = function () { img.remove(); };
        gallery.appendChild(img);
      });

      // Prev / Next navigation links
      const prevEl = document.getElementById('prev-project');
      const nextEl = document.getElementById('next-project');
      if (prevEl) prevEl.href = 'project.html?id=' + prev;
      if (nextEl) nextEl.href = 'project.html?id=' + next;
      // Initialize language selector on project.html
      let currentLang = localStorage.getItem('saidow_lang');
      if (!currentLang) {
        const timeZone = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        const userLangs = navigator.languages || [navigator.language || ''];
        currentLang = (userLangs.some(l => l.toLowerCase().includes('tr')) || timeZone.includes('Istanbul')) ? 'tr' : 'en';
      }

      function setProjectLang(lang) {
        localStorage.setItem('saidow_lang', lang);
        document.documentElement.lang = lang;
        const btnTr = document.getElementById('lang-tr');
        const btnEn = document.getElementById('lang-en');
        if (btnTr && btnEn) {
          btnTr.classList.toggle('active', lang === 'tr');
          btnEn.classList.toggle('active', lang === 'en');
        }
        updateProjectDetailI18n(lang);
      }

      const btnTr = document.getElementById('lang-tr');
      const btnEn = document.getElementById('lang-en');
      if (btnTr) btnTr.addEventListener('click', () => setProjectLang('tr'));
      if (btnEn) btnEn.addEventListener('click', () => setProjectLang('en'));

      setProjectLang(currentLang);
    })();
  </script>
  <script src="main.js?v=14.0"></script>
</body>
</html>
